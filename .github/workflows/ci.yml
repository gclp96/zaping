name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-upgrade:
    name: Historical upgrade pre-S1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No service/database shared with the API job. The launcher owns a new tmpfs server.
    env:
      NODE_ENV: test
      QA_AB_EXPECTED_HEAD: ${{ github.sha }}
    defaults:
      run:
        working-directory: app/api
    steps:
      - name: Checkout baseline history and candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Check runner repository guards
        run: node --test test/qa-ab-ci-runner.test.cjs

      - name: Pull PostgreSQL 16 for the isolated upgrade server
        run: docker pull postgres:16

      - name: Generate candidate Prisma client
        run: npx prisma generate

      - name: Build candidate API
        run: npm run build

      - name: Verify nine pre-S1 upgrade checks on disposable PostgreSQL
        run: node test/qa-ab-01.run.cjs --upgrade-only

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zaping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zaping_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/zaping_test?schema=public
      JWT_SECRET: ci-only-zaping-jwt-secret-012345678901234567890123456789
      FRONTEND_ORIGIN: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      PORT: "3001"
      TRUST_PROXY_HOPS: "0"
      RUN_DB_CONCURRENCY_TESTS: "1"
    defaults:
      run:
        working-directory: app/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations to ephemeral PostgreSQL
        run: npm run prisma:migrate:deploy

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run API tests
        run: npm test -- --runInBand

      - name: Run PostgreSQL concurrency E2E
        run: npm run test:concurrency

      - name: Verify R2A-02 invoice allocations on ephemeral PostgreSQL
        env:
          RUN_R2A02_PG: "1"
        run: npm run test:e2e -- --runInBand test/supplier-document-reconciliation.postgres.e2e-spec.ts

      - name: Verify receipt-document links on ephemeral PostgreSQL
        env:
          RUN_RECEIPT_DOCUMENT_LINKS_PG: "1"
        run: npm run test:e2e -- --runInBand test/receipt-document-links.postgres.e2e-spec.ts

      - name: Verify B3d3 R2 quarantine reconciliation on ephemeral PostgreSQL
        env:
          RUN_SUPPLIER_UPLOAD_RECONCILIATION_PG: "1"
        run: npm run test:e2e -- --runInBand test/supplier-attachment-upload-reconciliation.postgres.e2e-spec.ts

      - name: Verify B3d2 quota reservations and concurrency on ephemeral PostgreSQL
        env:
          RUN_SUPPLIER_UPLOAD_RESERVATIONS_PG: "1"
        run: npm run test:e2e -- --runInBand test/supplier-attachment-upload-reservations.postgres.e2e-spec.ts

      - name: Verify supplier attachment metadata and scanner gate on ephemeral PostgreSQL
        env:
          RUN_SUPPLIER_ATTACHMENTS_PG: "1"
        run: npm run test:e2e -- --runInBand test/supplier-document-attachments.postgres.e2e-spec.ts

      - name: Compile optional Cloudflare R2 QA smoke without network or secrets
        env:
          RUN_CLOUDFLARE_R2_QA_SMOKE: "0"
          R2_STORAGE_MODE: "disabled"
        run: npm run test:e2e -- --runInBand test/cloudflare-r2-readonly.qa.e2e-spec.ts

      - name: Verify R2A-01 supplier documents on ephemeral PostgreSQL
        env:
          RUN_SUPPLIER_DOC_PG: "1"
        run: npm run test:e2e -- --runInBand test/supplier-documents.postgres.e2e-spec.ts

      - name: Smoke supplier document receipt on ephemeral PHYSICAL PostgreSQL
        env:
          RUN_PURCHASE_RECEIPT_PG_SMOKE: "1"
        run: npm run test:e2e -- --runInBand test/purchase-receipt-supplier-document.postgres.e2e-spec.ts

      - name: Check unbatched expiry constraints on ephemeral PostgreSQL
        env:
          RUN_UNBATCHED_EXPIRY_MIGRATION_PG: "1"
        run: npm run test:e2e -- --runInBand test/inventory-position-expiry-migration.postgres.e2e-spec.ts

      - name: Typecheck production source
        run: npm run typecheck

      - name: Typecheck A+B receipt and identity tests
        run: npx tsc --noEmit -p test/tsconfig.insap-ab.json

      - name: Build API
        run: npm run build

      - name: Verify production timeout release gate blocks deployment
        run: |
          set -eu

          gate_log="$RUNNER_TEMP/zaping-healthcare-timeout-release-gate.log"
          set +e
          NODE_ENV=production npm run validate:healthcare-timeout-release > "$gate_log" 2>&1
          gate_status=$?
          set -e

          test "$gate_status" -eq 1
          grep -Fq \
            'Healthcare Company timeout policy selection is required in production.' \
            "$gate_log"
          rm -f "$gate_log"

      - name: Build API production runtime image
        run: docker build --tag zaping-api-runtime-ci .

      - name: Verify timeout release gate in production runtime image
        run: |
          set -eu

          gate_log="$RUNNER_TEMP/zaping-healthcare-timeout-runtime-gate.log"
          set +e
          docker run --rm --entrypoint npm \
            zaping-api-runtime-ci \
            run validate:healthcare-timeout-release > "$gate_log" 2>&1
          gate_status=$?
          set -e

          test "$gate_status" -eq 1
          grep -Fq \
            'Healthcare Company timeout policy selection is required in production.' \
            "$gate_log"
          rm -f "$gate_log"

      - name: Verify production startup is blocked before listening
        run: |
          set -eu

          export NODE_ENV=production
          export FRONTEND_ORIGIN=https://app.example.test
          export FRONTEND_BASE_URL=https://app.example.test
          export RESEND_API_KEY=ci-only-no-network-placeholder
          export EMAIL_FROM=qa@example.test
          export PORT=3201
          export TRUST_PROXY_HOPS=0

          startup_log="$RUNNER_TEMP/zaping-api-production-block.log"
          set +e
          timeout --signal=TERM 15s npm run start:prod > "$startup_log" 2>&1
          startup_status=$?
          set -e

          test "$startup_status" -eq 1
          grep -Fq \
            'Healthcare Company timeout policy selection is required in production.' \
            "$startup_log"
          rm -f "$startup_log"

      - name: Smoke non-production startup
        run: |
          set -eu
          set -o pipefail

          export NODE_ENV=test
          export PORT=3201
          export TRUST_PROXY_HOPS=0
          export INVENTORY_AUTHORITY_PROTOCOL=inventory-authority-v1
          export INVENTORY_RUNTIME_BUILD="ci-${GITHUB_SHA}"
          export INVENTORY_RUNTIME_ENVIRONMENT=ci

          startup_log="$RUNNER_TEMP/zaping-api-startup.log"
          setsid npm run start:prod > "$startup_log" 2>&1 &
          api_pid=$!

          cleanup() {
            kill -- -"$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            rm -f "$startup_log"
          }
          trap cleanup EXIT

          live_ok=false
          ready_ok=false
          for attempt in $(seq 1 30); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              exit 1
            fi

            if curl --fail --silent --show-error \
              http://127.0.0.1:3201/health/live | grep -Fq '"status":"ok"'; then
              live_ok=true
            fi

            if curl --fail --silent --show-error \
              http://127.0.0.1:3201/health/ready | grep -Fq '"status":"ok"'; then
              ready_ok=true
            fi

            if [ "$live_ok" = true ] && [ "$ready_ok" = true ]; then
              break
            fi

            sleep 1
          done

          test "$live_ok" = true
          test "$ready_ok" = true

      - name: Lint API
        run: npm run lint:check

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test -- --pool=forks --maxWorkers=2 --testTimeout=10000

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Lint web
        run: npm run lint
